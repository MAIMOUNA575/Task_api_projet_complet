services:
  task:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/Task_projet_complet?schema=public
      BETTER_AUTH_SECRET: "sgRA3sv+sDP0eN+FtitinCfiIlI0gu0ng0vQ8Dy72Gw="
      BETTER_AUTH_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: Task_projet_complet
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Task_projet_complet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: