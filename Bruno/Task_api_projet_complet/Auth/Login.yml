info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/auth/sign-in/email"
  body:
    type: json
    data: |-
      {
        "email":"mouna@gmail.com",
        "password":"motdepasse123",
        "name":"maimouna"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setEnvVar("token", res.getBody().token);
        bru.setEnvVar("userId", res.getBody().user.id)
    - type: tests
      code: |-
        test("status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("token present", function () {
          expect(res.getBody().token).to.be.a("string");
        });

        test("user present", function () {
          expect(res.getBody().user).to.be.an("object");
        });

        test("email correspond à la requête", function () {
          expect(res.getBody().user.email).to.equal(req.getBody().email);
        });

        test("id utilisateur present", function () {
          expect(res.getBody().user.id).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
